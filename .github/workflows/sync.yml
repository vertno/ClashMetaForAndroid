name: Stable release
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      source: ${{ steps.select.outputs.source }}
      core: ${{ steps.select.outputs.core }}
      upstream_tag: ${{ steps.select.outputs.upstream_tag }}
      waiting: ${{ steps.select.outputs.waiting }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/checkout@v6
        with:
          repository: vertno/mihomo
          ref: 1a89312b05a4b21b063c9d321117f2341e4a8f4f # release tools
          path: tools
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/python3 tools/release/sync.py
  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: .distribution-control
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch the pinned core branch used by CMake
        run: |
          tag=$(jq -r '.core.version' distribution.lock.json)
          sha=$(jq -r '.core.commit' distribution.lock.json)
          sub=core/src/foss/golang/clash
          git -C "$sub" fetch --no-tags origin "+refs/heads/builds/$tag:refs/remotes/origin/builds/$tag"
          test "$(git -C "$sub" rev-parse HEAD)" = "$sha"
          test "$(git -C "$sub" rev-parse "origin/builds/$tag")" = "$sha"
      - uses: ./.github/distribution-actions/setup
        with:
          release-tag: ${{ needs.plan.outputs.upstream_tag }}
      - name: Prepare the distribution package and signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          umask 077
          test -n "$KEYSTORE" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE" | base64 -d >release.keystore
          printf 'keystore.password=%s\nkey.alias=release\nkey.password=%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" >signing.properties
          printf '\ncustom.application.id=com.github.vertno.clash.meta\nremove.suffix=true\n' >>local.properties
      - uses: ./.github/distribution-actions/build
      - name: Verify the personal Android package and signing identity
        run: python3 .distribution-control/release/verify_apks.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/outputs/apk/meta/release/*.apk
            app/build/outputs/apk/meta/release/output-metadata.json
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: actions/checkout@v6
        with:
          repository: vertno/mihomo
          ref: 1a89312b05a4b21b063c9d321117f2341e4a8f4f # release tools
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Verify and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
        run: |
          python3 tools/release/publish.py
  wake:
    needs: [plan, publish]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.waiting == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report pending app installation
        if: vars.WAKE_APP_CLIENT_ID == ''
        run: echo '::warning::Cross-repository wake requires the release app. Scheduled reconciliation remains enabled.'
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        id: app
        if: vars.WAKE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.WAKE_APP_CLIENT_ID }}
          private-key: ${{ secrets.WAKE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: mihomo
          permission-actions: write
      - name: Wake dependent release checks
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          status=0
          for repo in mihomo; do
            gh workflow run sync.yml -R "vertno/$repo" --ref distribution || status=1
          done
          exit "$status"
